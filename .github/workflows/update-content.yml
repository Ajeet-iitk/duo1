name: Update live content
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/update-content.mjs
      - run: |
          git config user.name "bhasha-bot"; git config user.email "bot@users.noreply.github.com"
          git add assets/js/data/live-cache.js
          git diff --cached --quiet || (git commit -m "chore: refresh live sentences" && git push)
